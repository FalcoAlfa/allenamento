<style>
:root{color-scheme:light dark;--bg:#fbfbf9;--fg:#1a1a18;--card:#fff;--bordo:#e3e3db;
      --acc:#c2410c;--spento:#6f6f68;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--fg:#eceae4;--card:#1e1e22;
      --bordo:#34343c;--acc:#fb923c;--spento:#9b9b94;--ok:#4ade80}}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* .riga e' display:flex e vincerebbe */
body{margin:0 auto;max-width:34rem;font:17px/1.55 system-ui,-apple-system,sans-serif;
     background:var(--bg);color:var(--fg);
     padding:1rem 1rem calc(6rem + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:.2rem 0}
h2{font-size:1.1rem;margin:1.4rem 0 .4rem}
p{margin:.5rem 0}
a{color:var(--acc)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bordo);
       border-radius:.7rem;padding:.7rem 1rem;cursor:pointer;text-align:left}
button:active{transform:translateY(1px)}
.grande{display:block;width:100%;padding:1.1rem;font-size:1.2rem;font-weight:600;margin:.5rem 0}
.primario{background:var(--acc);color:#fff;border-color:transparent;text-align:center}
.piccolo{padding:.45rem .8rem;font-size:.9rem}
.riga{display:flex;gap:.5rem;flex-wrap:wrap}
.riga>*{flex:1}
.spento{color:var(--spento)}
.spento a{color:inherit}
small{font-size:.85rem}
input,select,textarea{font:inherit;color:inherit;background:var(--card);width:100%;
       border:1px solid var(--bordo);border-radius:.6rem;padding:.6rem}
label{display:block;margin:.7rem 0 .2rem;font-size:.95rem}
hr{border:0;border-top:1px solid var(--bordo);margin:1.2rem 0}
ul{padding-left:1.2rem}
/* --- seduta --- */
.barra{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.6rem;
       background:var(--bg);padding:.5rem 0;border-bottom:1px solid var(--bordo)}
.cron{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600;
      background:none;border:0;padding:.2rem .4rem;flex:0 0 auto}
.pausa{color:var(--acc)}
.dove{flex:1;text-align:right;color:var(--spento);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bordo);border-radius:1rem;
      padding:.9rem;margin:.8rem 0}
.card h2{margin:0;font-size:1.35rem}
svg{display:block;width:100%;height:auto;max-width:26rem;margin:.6rem auto;border-radius:.6rem}
.cue{color:var(--acc);font-weight:600}
.conto{font-variant-numeric:tabular-nums;font-size:3.2rem;font-weight:700;text-align:center;
       margin:.3rem 0;line-height:1.1}
.conto.riposo{color:var(--ok)}
.conto.finito{color:var(--acc)}
details{border-top:1px solid var(--bordo);padding:.15rem 0}
summary{cursor:pointer;font-weight:600;padding:.45rem 0}
details div{padding-bottom:.6rem}
.fondo{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:.5rem;
       background:var(--bg);border-top:1px solid var(--bordo);
       padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
       max-width:34rem;margin:0 auto}
.fondo button{flex:1;padding:.9rem .6rem;text-align:center}
.fondo .primario{flex:2;font-size:1.15rem;font-weight:700}
.voce{display:flex;align-items:center;gap:.4rem;border-bottom:1px solid var(--bordo);padding:.45rem 0}
.voce span{flex:1;color:var(--spento);font-size:.9rem}
.voce button{flex:0 0 auto}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bordo);
     border-radius:.5rem;padding:.1rem .45rem;font-size:.85rem;color:var(--spento)}
.scelto{outline:2px solid var(--acc)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);
    border:1px solid var(--bordo);border-radius:.6rem;padding:.7rem;font-size:.8rem;
    max-height:40vh;overflow:auto}
</style>
</head>

**prima** di spingere","tempo_s":90,"serie":1,"secondi":45,"per_lato":true,"recupero_s":0},{"chiave":"M:dead-bug","nome":"Dead bug","quanto":"6 per lato","cue":"lombare incollata a terra","tempo_s":60,"serie":1,"secondi":0,"per_lato":true,"recupero_s":0},{"chiave":"M:chin-tuck","nome":"Chin tuck","quanto":"8 ripetizioni","cue":"il mento va indietro, non giù","tempo_s":30,"serie":1,"secondi":0,"per_lato":false,"recupero_s":0},{"chiave":"M:posizione-del-bambino","nome":"Posizione del bambino","quanto":"60 s","cue":"respira dentro la schiena","tempo_s":60,"serie":1,"secondi":60,"per_lato":false,"recupero_s":0}]},"A":{"tipo":"forza","titolo":"spinta e verticale","blocchi":{"0":{"nome":"Riscaldamento (uguale in A e B)","nota":"5 minuti, di seguito, senza recuperi tranne dove indicato.","giri":1,"recupero_giro_s":0},"1":{"nome":"Skill (~10 min)","nota":"","giri":1,"recupero_giro_s":0},"2":{"nome":"Forza (~15 min)","nota":"","giri":1,"recupero_giro_s":0},"3":{"nome":"Finisher A (4 min)","nota":"**2 giri**, 45 s di recupero tra un giro e l'altro, nessun recupero dentro il giro.","giri":2,"recupero_giro_s":45},"4":{"nome":"Scarico (3 min)","nota":"**Sessione A**: S1 → S2 → S3 · **Sessione B**: S4 → S2 → S3","giri":1,"recupero_giro_s":0}},"esercizi":[{"chiave":"comune:R1","sigla":"R1","blocco":0},{"chiave":"comune:R2","sigla":"R2","blocco":0},{"chiave":"comune:R3","sigla":"R3","blocco":0},{"chiave":"comune:R4","sigla":"R4","blocco":0},{"chiave":"comune:R5","sigla":"R5","blocco":0},{"chiave":"A:A1","sigla":"A1","blocco":1},{"chiave":"A:A2","sigla":"A2","blocco":1},{"chiave":"A:A3","sigla":"A3","blocco":1},{"chiave":"A:A4","sigla":"A4","blocco":2},{"chiave":"A:A5","sigla":"A5","blocco":2},{"chiave":"A:A6","sigla":"A6","blocco":2},{"chiave":"A:A7","sigla":"A7","blocco":2},{"chiave":"A:F1","sigla":"F1","blocco":3},{"chiave":"A:F2","sigla":"F2","blocco":3},{"chiave":"comune:S1","sigla":"S1","blocco":4},{"chiave":"comune:S2","sigla":"S2","blocco":4},{"chiave":"comune:S3","sigla":"S3","blocco":4}]},"B":{"tipo":"forza","titolo":"trazione, core e L-sit","blocchi":{"0":{"nome":"Riscaldamento (uguale in A e B)","nota":"5 minuti, di seguito, senza recuperi tranne dove indicato.","giri":1,"recupero_giro_s":0},"1":{"nome":"Skill (~10 min)","nota":"","giri":1,"recupero_giro_s":0},"2":{"nome":"Forza (~15 min)","nota":"","giri":1,"recupero_giro_s":0},"3":{"nome":"Finisher B (4 min)","nota":"**2 giri**, 45 s di recupero tra un giro e l'altro.","giri":2,"recupero_giro_s":45},"4":{"nome":"Scarico (3 min)","nota":"**Sessione A**: S1 → S2 → S3 · **Sessione B**: S4 → S2 → S3","giri":1,"recupero_giro_s":0}},"esercizi":[{"chiave":"comune:R1","sigla":"R1","blocco":0},{"chiave":"comune:R2","sigla":"R2","blocco":0},{"chiave":"comune:R3","sigla":"R3","blocco":0},{"chiave":"comune:R4","sigla":"R4","blocco":0},{"chiave":"comune:R5","sigla":"R5","blocco":0},{"chiave":"B:B1","sigla":"B1","blocco":1},{"chiave":"B:B2","sigla":"B2","blocco":1},{"chiave":"B:B3","sigla":"B3","blocco":1},{"chiave":"B:B4","sigla":"B4","blocco":2},{"chiave":"B:B5","sigla":"B5","blocco":2},{"chiave":"B:B6","sigla":"B6","blocco":2},{"chiave":"B:B7","sigla":"B7","blocco":2},{"chiave":"B:F1","sigla":"F1","blocco":3},{"chiave":"B:F2","sigla":"F2","blocco":3},{"chiave":"comune:S4","sigla":"S4","blocco":4},{"chiave":"comune:S2","sigla":"S2","blocco":4},{"chiave":"comune:S3","sigla":"S3","blocco":4}]}},"esercizi":{"comune:R1":{"nome":"Preparazione polsi","figura":"preparazione-polsi.svg","quanto":"2 giri × 20 s per direzione","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=wrist+prep+routine+calisthenics+handstand","come":"In ginocchio. **(a)** Mani a terra con le dita in avanti,\noscilla il peso avanti e indietro. **(b)** Gira le mani con le **dita verso le\nginocchia**, palmi a terra, e siediti indietro lentamente. **(c)** Appoggia il\ndorso delle mani a terra e carica pochissimo.","attenzione":"Carica in modo graduale, non buttarti sul polso: qui non\ncerchi lo stretch massimo, cerchi di **preparare** l'articolazione. Se senti\ndolore acuto togli peso subito.","sfruttare":"Con i tuoi polsi delicati questo è il pezzo più\nimportante dell'intero programma: senza, crow e verticale ti costeranno un\ninfortunio. Trattalo come obbligatorio, non come riscaldamento facoltativo.","progredire":"Aumenta il peso caricato, mai la durata. Quando reggi il\ntuo peso pieno senza fastidio in tutte e tre le direzioni, sei pronto per la\nfase 3 delle skill.","sigla":"R1","sezione":"comune","blocco":0,"solo":"","vedi":"","serie":2,"secondi":20,"per_lato":false,"recupero_s":0},"comune:R2":{"nome":"Jumping jack","figura":"jumping-jack.svg","quanto":"45 s","recupero":"15 s","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=jumping+jacks+proper+form","come":"Salta aprendo le gambe e portando le mani sopra la testa,\nrichiudi. Ritmo continuo, respirazione libera.","attenzione":"Atterra sull'avampiede con le ginocchia morbide, non sui\ntalloni a gamba tesa.","sfruttare":"Serve solo ad alzare la temperatura e a svegliare\nil sistema nervoso dopo otto ore seduto. Non è un esercizio di condizionamento:\nnon ammazzarti qui.","progredire":"Non progredisce, resta 45 s.","sigla":"R2","sezione":"comune","blocco":0,"solo":"","vedi":"","serie":1,"secondi":45,"per_lato":false,"recupero_s":15},"comune:R3":{"nome":"Squat to stand","figura":"squat-to-stand.svg","quanto":"8 ripetizioni","recupero":"nessuno","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=squat+to+stand+mobility+drill","come":"In piedi, piegati e afferra le punte dei piedi. Da lì scendi in\naccosciata profonda tenendo le mani sui piedi e il petto alto. Poi alza il\nbacino distendendo le gambe, senza lasciare i piedi. Ripeti.","attenzione":"Se non arrivi ai piedi a gambe tese, piega le ginocchia\nquanto serve: l'obiettivo non è toccare i piedi, è passare tra le due posizioni.","sfruttare":"Nella fase bassa spingi i gomiti contro\nl'interno delle ginocchia per aprire le anche. Prepara anche, caviglie e\nischiocrurali in un colpo solo.","progredire":"Da 8 a 10 quando la fase bassa è comoda.","sigla":"R3","sezione":"comune","blocco":0,"solo":"","vedi":"","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"comune:R4":{"nome":"Push-up scapolare","figura":"push-up-scapolare.svg","quanto":"10 ripetizioni","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=scapular+push+ups+protraction+tutorial","come":"In posizione di plank sulle mani, **braccia sempre tese**.\nLascia affondare il petto tra le spalle avvicinando le scapole, poi spingi il\npavimento lontano allargando le scapole e salendo di qualche centimetro.","attenzione":"I gomiti non si piegano mai. Se si piegano stai facendo un\npiegamento, e l'esercizio non serve più a niente.","sfruttare":"È il movimento che ti insegna a **spingere via\nil pavimento**: la stessa attivazione che regge la verticale. Falla lentamente,\n2 secondi per fase.","progredire":"Da 10 a 15. Poi in appoggio con i piedi rialzati sulla sedia.","sigla":"R4","sezione":"comune","blocco":0,"solo":"","vedi":"","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"comune:R5":{"nome":"Dead hang","figura":"dead-hang.svg","quanto":"30 s","recupero":"nessuno","attrezzi":"sbarra","video":"https://www.youtube.com/results?search_query=dead+hang+tutorial+beginner","come":"Appeso alla sbarra, presa alla larghezza delle spalle, pollici\nattorno. Braccia tese, spalle **attive**: non lasciarti crollare passivamente\ndentro le spalle. Corpo fermo.","attenzione":"Non dondolare e non staccarti di colpo: scendi controllato.\nSe le mani cedono prima delle spalle, è normale a inizio percorso.","sfruttare":"Qui sta appeso il tuo obiettivo n°2 e anche il\nmiglior regalo che puoi fare alla schiena dopo una giornata su una sedia: la\ncolonna si decomprime. Nel riscaldamento è un dead hang **facile**, non un test:\nil massimale lo fai nella sessione B.","progredire":"Nel riscaldamento resta a 30 s. Il tempo massimo si allena\nin B1.","sigla":"R5","sezione":"comune","blocco":0,"solo":"","vedi":"","serie":1,"secondi":30,"per_lato":false,"recupero_s":0},"A:A1":{"nome":"L-sit","figura":"l-sit.svg","quanto":"3 × 10-20 s","recupero":"60 s","attrezzi":"tappetino, due rialzi solidi","video":"https://www.youtube.com/results?search_query=l+sit+progression+tutorial+beginner","come":"Seduto a terra, mani appoggiate a fianco dei fianchi. Spingi\nforte in basso, **abbassa le spalle** (non alzarle verso le orecchie) e stacca\nil sedere da terra tenendo le ginocchia raccolte al petto. Progressione:\n\n1. Sedere sollevato, **piedi ancora appoggiati** a terra\n2. **L-sit raccolto**: ginocchia al petto, piedi staccati\n3. Una gamba tesa, una raccolta (alterna)\n4. **L-sit completo**: gambe tese e parallele al pavimento","attenzione":"Se non riesci a staccare il sedere, alza le mani su due\nrialzi solidi da 10-15 cm (due pile di libri, due scatole robuste): guadagni\nlo spazio che ti mancano le braccia. Non tenere le spalle scrollate su.","sfruttare":"Spingi il pavimento verso il basso e **arrotonda\nleggermente la zona lombare** portando il bacino sotto. È quella retroversione\nche alza le gambe, non la forza degli addominali.","progredire":"Quando tieni 20 s per 2 sedute consecutive, passi al\nlivello successivo della progressione.\n*Alternativa nei giorni in cui le spalle sono stanche*: sollevamento ginocchia\nappeso alla sbarra, 3 × 8 — allena lo stesso schema con meno carico sui polsi.","sigla":"A1","sezione":"A","blocco":1,"solo":"","vedi":"","serie":3,"secondi":20,"per_lato":false,"recupero_s":60},"A:A2":{"nome":"Crow pose","figura":"crow-pose.svg","quanto":"3 × 10-20 s","recupero":"60 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=crow+pose+bakasana+tutorial+beginner","come":"Accovacciato, mani a terra a larghezza spalle, dita ben\naperte. Piega **leggermente** i gomiti e appoggia le ginocchia sulla parte alta\ndelle braccia, vicino alle ascelle. Sposta il peso in avanti finché i piedi si\nstaccano da soli.","attenzione":"**Guarda avanti**, un palmo oltre le mani, non sotto di te:\nguardare in basso ti fa cadere in avanti. Metti un cuscino davanti alle prime\nvolte. Se i polsi protestano, ferma la serie: non è negoziabile.","sfruttare":"Gomiti leggermente piegati e rivolti indietro,\nnon aperti ai lati, e **spingi il pavimento** con le nocche. È il primo\nesercizio che ti insegna a stare sulle mani e la porta d'ingresso della\nverticale.","progredire":"20 s stabili per 2 sedute → prova a distendere le braccia\n(crane pose). Poi crow con un piede che si stacca.","sigla":"A2","sezione":"A","blocco":1,"solo":"","vedi":"","serie":3,"secondi":20,"per_lato":false,"recupero_s":60},"A:A3":{"nome":"Verticale al muro (wall walk)","figura":"verticale-al-muro.svg","quanto":"3 × 3-5 passi","recupero":"75 s","attrezzi":"muro libero, tappetino","video":"https://www.youtube.com/results?search_query=wall+walk+handstand+progression+tutorial","come":"Piedi appoggiati al muro basso, mani a terra lontane dal muro,\ncorpo in linea. Cammina con i piedi **su** per il muro e contemporaneamente\navvicina le mani al muro, un passo per volta. Fermati dove ti senti in\ncontrollo, poi torna indietro camminando, non buttandoti.","attenzione":"È la **pancia** che va verso il muro, non la schiena: la\nverticale si impara in questa posizione, non a schiena al muro. Non inarcare i\nlombi per compensare — è la tua zona sensibile. Spalle sempre spinte verso\nl'alto, orecchie tra le braccia.","sfruttare":"Conta i passi e segnali sul diario. La distanza\nmani-muro è il tuo metro di progresso: si accorcia settimana dopo settimana\nfino a naso quasi al muro.","progredire":"Quando arrivi col naso a 10 cm dal muro e tieni 20 s,\ninizia a staccare un piede alla volta per cercare l'equilibrio.","sigla":"A3","sezione":"A","blocco":1,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":75},"A:A4":{"nome":"Piegamenti","figura":"piegamenti.svg","quanto":"4 × 6-12","recupero":"75 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=push+up+proper+form+elbows+45+degrees","come":"Mani poco più larghe delle spalle, corpo rigido dalla testa ai\ntalloni. Scendi fino a sfiorare il pavimento col petto tenendo i **gomiti a\ncirca 45°** rispetto al busto, poi spingi.","attenzione":"Il bacino non deve cedere verso il basso né alzarsi.\nContrai glutei e addome per tutta la serie. Gomiti aperti a 90° = spalle in\nsofferenza, e le tue sono già provate dalla scrivania.","sfruttare":"Alla fine della spinta **allarga le scapole**,\ncome nel push-up scapolare. La maggior parte delle persone si ferma prima e\nperde il pezzo che serve alla verticale.","progredire":"Se non arrivi a 6, appoggia le mani sulla sedia (più\nfacile). Superati 12 × 2 sedute → piedi rialzati sulla sedia, poi mani più\nstrette.","sigla":"A4","sezione":"A","blocco":2,"solo":"","vedi":"","serie":4,"secondi":0,"per_lato":false,"recupero_s":75},"A:A5":{"nome":"Piegamenti pike","figura":"piegamenti-pike.svg","quanto":"3 × 5-8","recupero":"75 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=pike+push+up+tutorial+handstand+push+up+progression","come":"Dalla posizione di plank, cammina coi piedi verso le mani fino\na formare una **V rovesciata** con il bacino alto. Braccia tese. Scendi\npiegando i gomiti finché la testa arriva vicino al pavimento, **davanti** alle\nmani, poi spingi.","attenzione":"La testa non va **tra** le mani ma davanti, altrimenti il\ncarico si sposta sul petto invece che sulle spalle. Non far crollare il bacino\ndurante la spinta.","sfruttare":"Più alzi il bacino, più l'esercizio somiglia a un\npiegamento in verticale. È il costruttore di forza numero uno per la verticale:\nse vuoi la fase 4, questo è l'esercizio che ti ci porta.","progredire":"8 × 2 sedute → piedi rialzati sulla sedia (pike push-up\nrialzato). È già metà di un piegamento in verticale.","sigla":"A5","sezione":"A","blocco":2,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":75},"A:A6":{"nome":"Affondo bulgaro","figura":"affondo-bulgaro.svg","quanto":"2 × 10 per gamba","recupero":"60 s","attrezzi":"sedia, tappetino","video":"https://www.youtube.com/results?search_query=bulgarian+split+squat+bodyweight+chair+tutorial","come":"In piedi, un passo davanti alla sedia. Appoggia il collo del\npiede posteriore sulla seduta. Scendi dritto piegando la gamba davanti fino a\nportare il ginocchio dietro vicino a terra, poi risali spingendo col tallone\ndavanti.","attenzione":"Il busto resta dritto e il ginocchio davanti non deve\ncrollare verso l'interno. Se perdi l'equilibrio, sfiora il muro con una mano.","sfruttare":"È l'unico esercizio serio per le gambe che puoi\nfare senza sovraccarico: allenandolo su una gamba sola ottieni uno stimolo\nreale anche senza pesi. Scendi in 3 secondi e sali in 1.","progredire":"12 per gamba pulite × 2 sedute → aggiungi 2 secondi di\npausa in basso, poi uno zaino con dei libri sulle spalle.","sigla":"A6","sezione":"A","blocco":2,"solo":"","vedi":"","serie":2,"secondi":0,"per_lato":true,"recupero_s":60},"A:A7":{"nome":"Hollow body hold","figura":"hollow-body.svg","quanto":"3 × 20-30 s","recupero":"40 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=hollow+body+hold+tutorial+progression","come":"Sdraiato sulla schiena. Schiaccia la **zona lombare contro il\npavimento** e tienila lì. Da quella posizione solleva spalle e gambe, braccia\ntese oltre la testa. Il corpo forma una banana leggera.","attenzione":"Se la zona lombare si stacca da terra, **piega le ginocchia**\no tieni le braccia lungo i fianchi finché non riesci. Questo è il punto in cui\nla tua schiena può farsi male: la lombare a terra è la condizione, non un\ndettaglio.","sfruttare":"È esattamente la tensione che ti serve per la\nverticale e per l'L-sit: corpo unico e rigido. Respira poco e corto, non\ntrattenere il fiato per tutta la tenuta.","progredire":"30 s × 2 sedute → allunga le braccia oltre la testa o\naggiungi un dondolio controllato (hollow rock).","sigla":"A7","sezione":"A","blocco":2,"solo":"","vedi":"","serie":3,"secondi":30,"per_lato":false,"recupero_s":40},"A:F1":{"nome":"Mountain climber","figura":"mountain-climber.svg","quanto":"30 s","recupero":"0 (poi F2)","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=mountain+climbers+proper+form","come":"In plank sulle mani, porta alternativamente un ginocchio verso\nil petto a ritmo sostenuto.","attenzione":"Il bacino resta **basso e fermo**: se rimbalza su e giù\nstai facendo cardio con la schiena, non con le gambe.","sfruttare":"Mani ben piantate e scapole larghe: diventa anche\nun lavoro di stabilità della spalla, non solo fiato.","sigla":"F1","sezione":"A","blocco":3,"solo":"","vedi":"","serie":1,"secondi":30,"per_lato":false,"recupero_s":0},"A:F2":{"nome":"Ginocchia alte","figura":"ginocchia-alte.svg","quanto":"30 s","recupero":"45 s a fine giro","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=high+knees+exercise+form","come":"Corsa sul posto portando il ginocchio **sopra l'altezza\ndell'anca**, busto dritto, appoggio sull'avampiede.","attenzione":"Non inclinarti indietro per alzare di più le ginocchia.","sfruttare":"Alza la frequenza, non l'ampiezza: contano i\ncambi rapidi.","sigla":"F2","sezione":"A","blocco":3,"solo":"","vedi":"","serie":1,"secondi":30,"per_lato":false,"recupero_s":0},"B:B1":{"nome":"L-sit","figura":"l-sit.svg","quanto":"3 × 10-20 s","recupero":"60 s","attrezzi":"tappetino, due rialzi solidi","video":"https://www.youtube.com/results?search_query=l+sit+progression+tutorial+beginner","sigla":"B1","sezione":"B","blocco":1,"solo":"","vedi":"A1","come":"Seduto a terra, mani appoggiate a fianco dei fianchi. Spingi\nforte in basso, **abbassa le spalle** (non alzarle verso le orecchie) e stacca\nil sedere da terra tenendo le ginocchia raccolte al petto. Progressione:\n\n1. Sedere sollevato, **piedi ancora appoggiati** a terra\n2. **L-sit raccolto**: ginocchia al petto, piedi staccati\n3. Una gamba tesa, una raccolta (alterna)\n4. **L-sit completo**: gambe tese e parallele al pavimento","attenzione":"Se non riesci a staccare il sedere, alza le mani su due\nrialzi solidi da 10-15 cm (due pile di libri, due scatole robuste): guadagni\nlo spazio che ti mancano le braccia. Non tenere le spalle scrollate su.","sfruttare":"Spingi il pavimento verso il basso e **arrotonda\nleggermente la zona lombare** portando il bacino sotto. È quella retroversione\nche alza le gambe, non la forza degli addominali.","progredire":"Quando tieni 20 s per 2 sedute consecutive, passi al\nlivello successivo della progressione.\n*Alternativa nei giorni in cui le spalle sono stanche*: sollevamento ginocchia\nappeso alla sbarra, 3 × 8 — allena lo stesso schema con meno carico sui polsi.","da_sigla":"A1","serie":3,"secondi":20,"per_lato":false,"recupero_s":60},"B:B2":{"nome":"Trazione scapolare","figura":"trazione-scapolare.svg","quanto":"3 × 6-8","recupero":"60 s","attrezzi":"sbarra","video":"https://www.youtube.com/results?search_query=scapular+pull+ups+tutorial+first+pull+up","come":"Appeso a braccia tese. Senza piegare i gomiti, **abbassa le\nspalle** allontanandole dalle orecchie: il corpo sale di 3-5 cm. Tieni un\nsecondo in alto, poi torna giù controllato.","attenzione":"I gomiti restano **tesi** per tutta la ripetizione. Se si\npiegano stai tentando una trazione e perdi l'esercizio.","sfruttare":"È il pezzo mancante di chi non riesce a fare\ntrazioni: prima di tirare con le braccia devi saper **attivare le scapole**.\nNella tua situazione — zero trazioni — è l'esercizio che sblocca la prima.","progredire":"8 × 2 sedute → aggiungi 2 s di tenuta in alto, poi passa\na farle su un braccio alla volta.","sigla":"B2","sezione":"B","blocco":1,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":60},"B:B3":{"nome":"Trazione negativa","figura":"trazione-negativa.svg","quanto":"3 × 3 (5 s di discesa)","recupero":"90 s","attrezzi":"sbarra, sedia","video":"https://www.youtube.com/results?search_query=negative+pull+ups+tutorial+first+pull+up+progression","come":"Salta (o sali sulla sedia) fino a portare il **mento sopra la\nsbarra**. Da lì scendi il più lentamente possibile, contando 5 secondi, fino a\nbraccia completamente tese. Torna su saltando, non tirando.","attenzione":"Non lasciarti cadere alla fine: la parte più utile è\nproprio l'ultimo terzo, quello in cui le braccia sono quasi tese. Tieni le\nspalle attive, non crollare dentro le scapole in fondo alla discesa.","sfruttare":"Il cronometro è tutto: **la durata della discesa\nè il carico**. Non aggiungere ripetizioni, allunga i secondi. Sono la via più\ndiretta alla tua prima trazione.","progredire":"Quando controlli 8 secondi per 3 ripetizioni, prova la\nprima trazione completa. Se non esce, resta sulle negative a 10 s.","sigla":"B3","sezione":"B","blocco":1,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":90},"B:B4":{"nome":"Y-T-W a terra","figura":"ytw-prono.svg","quanto":"3 × (8 Y + 8 T)","recupero":"45 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=prone+Y+T+W+raises+posture+exercise","come":"A pancia in giù, fronte appoggiata a terra. **Y**: braccia in\navanti a 45°, pollici verso l'alto, solleva le braccia di pochi centimetri.\n**T**: braccia a croce, solleva stringendo le scapole. Un secondo di tenuta in\nalto, poi giù.","attenzione":"**Non alzare la testa e non inarcare la schiena**: si\nsollevano solo le braccia, il petto resta a terra. Con la tua lombare questa\nregola è tassativa.","sfruttare":"Movimento minuscolo, tenuta di 1-2 secondi,\nzero slancio. Lavora i muscoli che tengono le scapole indietro, cioè\nl'antidoto diretto alle spalle chiuse in avanti dal computer.","progredire":"12+12 pulite × 2 sedute → aggiungi la **W** (gomiti\npiegati vicino ai fianchi) come terza posizione.","sigla":"B4","sezione":"B","blocco":2,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":45},"B:B5":{"nome":"Squat a corpo libero","figura":"squat.svg","quanto":"3 × 15","recupero":"60 s","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=bodyweight+squat+proper+form+tutorial","come":"Piedi a larghezza spalle, punte leggermente in fuori. Manda il\nsedere **indietro** e scendi finché le cosce sono almeno parallele al pavimento,\nbraccia avanti per bilanciare. Risali spingendo col pavimento.","attenzione":"Schiena neutra: in fondo alla discesa il bacino non deve\n\"arrotolarsi\" sotto. Peso sui talloni e su tutta la pianta, ginocchia in linea\ncoi piedi.","sfruttare":"Scendi in 3 secondi, fermati 1 secondo in basso e\nrisali. Con 15 ripetizioni lente ottieni molto più che con 30 veloci.","progredire":"20 pulite × 2 sedute → squat bulgaro come in A6, poi\nprogressione verso il pistol squat tenendoti alla sedia.","sigla":"B5","sezione":"B","blocco":2,"solo":"","vedi":"","serie":3,"secondi":0,"per_lato":false,"recupero_s":60},"B:B6":{"nome":"Plank laterale","figura":"plank-laterale.svg","quanto":"3 × 20-30 s per lato","recupero":"40 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=side+plank+mcgill+proper+form","come":"Su un fianco, gomito **sotto la spalla**, gambe tese una sopra\nl'altra. Alza il bacino finché il corpo è in linea da testa a piedi. L'altro\nbraccio verso l'alto o sul fianco.","attenzione":"L'anca non deve calare verso il pavimento e il corpo non\ndeve ruotare in avanti. Se 20 s sono troppi, appoggia le ginocchia.","sfruttare":"È uno dei tre esercizi McGill per la schiena:\nallena i muscoli laterali del tronco **senza flettere la colonna**, ed è per\nquesto che è nel tuo programma invece dei crunch.","progredire":"30 s per lato × 2 sedute → solleva il braccio in alto, poi\nalza la gamba superiore.","sigla":"B6","sezione":"B","blocco":2,"solo":"","vedi":"","serie":3,"secondi":30,"per_lato":true,"recupero_s":40},"B:B7":{"nome":"Bird dog","figura":"bird-dog.svg","quanto":"2 × 8 per lato","recupero":"30 s","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=bird+dog+exercise+mcgill+proper+form","come":"In quadrupedia. Allunga **braccio destro e gamba sinistra**\nfino all'altezza del bacino, tieni 3 secondi, torna e cambia. Braccio e gamba\nrestano paralleli al pavimento, non più in alto.","attenzione":"Il bacino non deve **ruotare**: immagina un bicchiere\nd'acqua appoggiato sulla zona lombare che non deve rovesciarsi. Non alzare la\ngamba oltre la linea del corpo, è lì che la lombare si inarca.","sfruttare":"Allunga come se qualcuno ti tirasse la mano da\nuna parte e il tallone dall'altra. È il terzo esercizio McGill e chiude il\nlavoro sulla tua schiena.","progredire":"8 per lato con 5 s di tenuta × 2 sedute → tocca gomito e\nginocchio sotto la pancia tra una ripetizione e l'altra.","sigla":"B7","sezione":"B","blocco":2,"solo":"","vedi":"","serie":2,"secondi":0,"per_lato":true,"recupero_s":30},"B:F1":{"nome":"Burpee","figura":"burpee.svg","quanto":"6 ripetizioni","recupero":"0 (poi F2)","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=burpee+proper+form+beginner","come":"Accovacciati e appoggia le mani a terra, manda i piedi indietro\nin plank, riportali avanti, salta in alto con le braccia sopra la testa.","attenzione":"Nella fase di plank il corpo deve restare **rigido**: è lì\nche la schiena cede quando arriva la stanchezza. Se il salto è troppo, alzati\nsemplicemente in piedi.","sfruttare":"Meglio 6 burpee puliti che 12 sciatti. Rallenta\nla fase di plank e resta rigido.","sigla":"F1","sezione":"B","blocco":3,"solo":"","vedi":"","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"B:F2":{"nome":"Jumping jack","figura":"jumping-jack.svg","quanto":"30 s","recupero":"","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=jumping+jacks+proper+form","sigla":"F2","sezione":"B","blocco":3,"solo":"","vedi":"R2","come":"Salta aprendo le gambe e portando le mani sopra la testa,\nrichiudi. Ritmo continuo, respirazione libera.","attenzione":"Atterra sull'avampiede con le ginocchia morbide, non sui\ntalloni a gamba tesa.","sfruttare":"Serve solo ad alzare la temperatura e a svegliare\nil sistema nervoso dopo otto ore seduto. Non è un esercizio di condizionamento:\nnon ammazzarti qui.","progredire":"Non progredisce, resta 45 s.","da_sigla":"R2","serie":1,"secondi":30,"per_lato":false,"recupero_s":0},"comune:S1":{"nome":"Stretch del petto alla porta","figura":"stretch-petto-porta.svg","quanto":"40 s per lato","recupero":"","attrezzi":"stipite di una porta","video":"https://www.youtube.com/results?search_query=doorway+chest+stretch+proper+form","come":"Avambraccio appoggiato allo stipite, **gomito all'altezza\ndella spalla**. Fai un passo avanti e ruota il petto dalla parte opposta.","attenzione":"Se il gomito è più alto della spalla, il carico va sulla\ncapsula articolare. Tensione, mai dolore.","sfruttare":"Respira lentamente e ad ogni espirazione ruota\nun grado in più. È il contrappeso diretto della postura chiusa da scrivania.","sigla":"S1","sezione":"comune","blocco":4,"solo":"A","vedi":"","serie":1,"secondi":40,"per_lato":true,"recupero_s":0},"comune:S4":{"nome":"Stretch degli ischiocrurali","figura":"stretch-ischiocrurali.svg","quanto":"40 s per lato","recupero":"","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=supine+hamstring+stretch+proper+form","come":"Sdraiato sulla schiena, porta una gamba tesa verso l'alto\ntenendola dietro la coscia con le mani. L'altra gamba resta appoggiata a terra.","attenzione":"La gamba a terra non deve sollevarsi e la lombare resta\nappoggiata: è così che l'allungamento arriva davvero dietro la coscia.","sfruttare":"Ischiocrurali corti = bacino tirato indietro =\nlombare sotto stress tutto il giorno. È stretching di manutenzione per la tua\nschiena, non un extra.","sigla":"S4","sezione":"comune","blocco":4,"solo":"B","vedi":"","serie":1,"secondi":40,"per_lato":true,"recupero_s":0},"comune:S2":{"nome":"Stretch dei flessori dell'anca","figura":"stretch-flessori-anca.svg","quanto":"40 s per lato","recupero":"","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=kneeling+hip+flexor+stretch+posterior+pelvic+tilt","come":"In affondo con il ginocchio dietro a terra. Porta il **bacino\nsotto** (retroversione) e contrai il gluteo della gamba dietro, poi spingi\navanti di pochi centimetri.","attenzione":"Se inarchi la schiena per andare più avanti, l'allungamento\nsparisce e la lombare si carica. Bacino sotto **prima**, avanzamento dopo.","sfruttare":"Il gluteo contratto è ciò che rende efficace\nquesto stretch. Sono i muscoli più accorciati da chi sta seduto tutto il\ngiorno, e tirano direttamente sulla tua zona lombare.","sigla":"S2","sezione":"comune","blocco":4,"solo":"","vedi":"","serie":1,"secondi":40,"per_lato":true,"recupero_s":0},"comune:S3":{"nome":"Posizione del bambino","figura":"posizione-bambino.svg","quanto":"60 s","recupero":"","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=childs+pose+balasana+tutorial","come":"In ginocchio, ginocchia larghe e alluci che si toccano.\nSiediti sui talloni e allunga le braccia in avanti, fronte a terra.","attenzione":"Se le ginocchia danno fastidio, metti un cuscino sotto i\nglutei.","sfruttare":"Respira dentro la schiena: senti la zona\nlombare che si apre a ogni inspirazione. Chiude la seduta e riporta giù il\nbattito.","sigla":"S3","sezione":"comune","blocco":4,"solo":"","vedi":"","serie":1,"secondi":60,"per_lato":false,"recupero_s":0},"M:respirazione-9090":{"nome":"Respirazione 90/90","figura":"respirazione-90-90.svg","quanto":"6 respiri lenti","recupero":"nessuno","attrezzi":"tappetino, sedia","video":"https://www.youtube.com/results?search_query=90+90+breathing+exercise+tutorial","come":"Sdraiato sulla schiena, polpacci sulla sedia: anche a 90°,\nginocchia a 90°. Una mano sul petto, una sulla pancia. Inspira dal naso per 4\nsecondi facendo gonfiare **solo la pancia**, espira dalla bocca per 6 secondi\nsvuotando tutto.","attenzione":"Se si alza la mano sul petto stai respirando con le spalle:\nè l'abitudine da scrivania che stiamo togliendo. Non inarcare la schiena\nmentre inspiri.","sfruttare":"Alla fine di ogni espirazione aspetta un secondo\nprima di riprendere aria. È quel momento che riattiva diaframma e core\nprofondo, e prepara tutto il resto.","progredire":"Quando 6 respiri vengono facili, allunga l'espirazione a\n8 secondi. Non aumentare il numero di respiri.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:gatto-cammello":{"nome":"Gatto-cammello","figura":"gatto-cammello.svg","quanto":"6-8 ripetizioni lente","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=cat+cow+stretch+proper+form","come":"In quadrupedia, mani sotto le spalle e ginocchia sotto le\nanche. **Gatto**: spingi la schiena verso il soffitto vertebra per vertebra,\nmento al petto. **Mucca**: lascia scendere la pancia, apri il petto, guarda\navanti. Un ciclo dura circa 6 secondi.","attenzione":"Non forzare la fase \"mucca\" schiacciando la zona lombare:\ncon la tua schiena il movimento deve venire dal tratto **dorsale**, non da un\ncrollo dei lombi.","sfruttare":"Muoviti un pezzo alla volta, dal bacino alla\ntesta. Se la schiena si muove in blocco stai facendo ginnastica, non mobilità.","progredire":"Non serve: resta sul numero previsto, cerca più ampiezza\ne più lentezza.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:rotazione-toracica":{"nome":"Rotazione toracica","figura":"rotazione-toracica.svg","quanto":"6 per lato","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=quadruped+thoracic+rotation+hand+behind+head","come":"In quadrupedia, una mano dietro la testa. Porta il gomito\nverso il basso, verso la mano appoggiata, poi ruota il busto e apri il gomito\nverso il soffitto seguendolo con lo sguardo.","attenzione":"Il bacino resta fermo e squadrato. Se si inclina, la\nrotazione arriva dai lombi invece che dal tratto dorsale: hai perso\nl'esercizio.","sfruttare":"In apertura fermati 2 secondi e prendi un\nrespiro. È l'esercizio più utile che hai contro le ore passate curvo sulla\ntastiera.","progredire":"Da 6 a 8 per lato quando arrivi comodo a guardare il\nsoffitto.","serie":1,"secondi":0,"per_lato":true,"recupero_s":0},"M:dead-bug":{"nome":"Dead bug","figura":"dead-bug.svg","quanto":"6 per lato, alternati","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=dead+bug+exercise+proper+form+lower+back","come":"Sdraiato sulla schiena, braccia verso il soffitto e gambe a\n90° (\"tavolino\"). Schiaccia la zona lombare a terra. Allunga **braccio destro\ne gamba sinistra** insieme verso il pavimento senza toccarlo, torna, cambia.","attenzione":"Nel momento in cui la lombare si stacca da terra, sei andato\ntroppo in basso. Con la tua schiena è il punto critico: meglio un movimento\npiccolo e pulito che uno ampio e cedevole.","sfruttare":"Espira mentre allunghi. È un esercizio di\n**resistenza alla deformazione**: non sono le gambe a lavorare, è la schiena\nche non si deve muovere.","progredire":"Quando 6 per lato con la lombare incollata sono facili,\nrallenta a 4 secondi per ripetizione prima di aumentare il numero.","serie":1,"secondi":0,"per_lato":true,"recupero_s":0},"M:chin-tuck":{"nome":"Chin tuck","figura":"chin-tuck.svg","quanto":"8 ripetizioni, 3 s ciascuna","recupero":"nessuno","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=chin+tuck+exercise+forward+head+posture","come":"In piedi, sguardo dritto. Porta il mento **indietro** in\norizzontale, come per farti il doppio mento, allungando la nuca verso l'alto.\nTieni 3 secondi, rilascia.","attenzione":"Non è un movimento verso il basso: il mento non scende, va\nindietro. Non deve fare male, se senti pizzicare riduci l'ampiezza.","sfruttare":"Immagina che qualcuno ti tiri su per un capello\nin cima alla testa mentre porti il mento indietro. Sono i flessori profondi\ndel collo, gli unici che compensano la testa in avanti costruita davanti al\nmonitor. È in tutte e tre le routine perché è la tua zona più a rischio.","progredire":"Non aumentare le ripetizioni: aggiungi 2 serie sparse\ndurante la giornata di lavoro.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:pass-through-col-bastone":{"nome":"Pass-through col bastone","figura":"pass-through-bastone.svg","quanto":"8 ripetizioni","recupero":"nessuno","attrezzi":"bastone","video":"https://www.youtube.com/results?search_query=shoulder+dislocates+pass+through+stick+mobility","come":"In piedi, impugna il bastone davanti a te con presa **molto\nlarga** e braccia tese. Portalo sopra la testa e poi dietro la schiena, sempre\na braccia tese. Torna avanti per la stessa strada.","attenzione":"Le braccia non si piegano mai e la schiena non si inarca per\n\"aiutare\" il passaggio. Se non ci arrivi, **allarga la presa**: non barare con\nla colonna.","sfruttare":"Parti dalla presa più larga possibile e\nstringila di un dito per volta nel corso delle settimane. La presa è il modo\nin cui si misura il guadagno di mobilità delle spalle, e ti serve tutta per la\nverticale.","progredire":"Quando 8 ripetizioni sono pulite, stringi la presa di\n2 cm per lato. La presa è il carico di questo esercizio.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:angelo-al-muro":{"nome":"Angelo al muro","figura":"angelo-al-muro.svg","quanto":"8 ripetizioni lente","recupero":"nessuno","attrezzi":"muro","video":"https://www.youtube.com/results?search_query=wall+angels+exercise+posture+tutorial","come":"Schiena al muro, piedi a 20 cm dal muro. Devono toccare il\nmuro: sacro, zona dorsale, testa, gomiti e dorso delle mani. Parti con le\nbraccia a 90° e falle scivolare in alto restando a contatto, poi torna giù.","attenzione":"Non staccare la lombare dal muro per salire più in alto.\nSali solo fin dove **tutti** i punti di contatto reggono: quello è il tuo\nrange vero, e crescerà.","sfruttare":"Sali e scendi in 4 secondi ciascuno. È\nl'antidoto diretto alla postura chiusa da computer.","progredire":"Quando le mani arrivano in alto restando a contatto,\nallontana i piedi di altri 10 cm dal muro.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:puppy-pose":{"nome":"Puppy pose","figura":"puppy-pose.svg","quanto":"60 s statici","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=puppy+pose+uttana+shishosana+tutorial","come":"A quattro zampe. **Tenendo il bacino sopra le ginocchia**,\ncammina in avanti con le mani e lascia scendere il petto e le ascelle verso il\npavimento. Appoggia la fronte a terra e fai respiri lunghi e profondi.","attenzione":"Il bacino non deve scendere all'indietro verso i talloni:\nin quel caso diventa la posizione del bambino e perdi l'estensione del tratto\ndorsale, che è tutto il senso dell'esercizio. Se la lombare si inarca troppo,\nalza leggermente il bacino.","sfruttare":"Spingi le ascelle verso il pavimento invece di\nschiacciare il petto: il lavoro deve arrivare tra le scapole. È l'unico\nesercizio che estende attivamente la parte alta della schiena — esattamente la\ncurva che il computer ti costruisce ogni giorno.","progredire":"Quando 60 s sono comodi, appoggia i gomiti su un rialzo\nper aumentare l'apertura, oppure sali a 90 s.","serie":1,"secondi":60,"per_lato":false,"recupero_s":0},"M:elephant-walks":{"nome":"Elephant walks","figura":"elephant-walks.svg","quanto":"30-40 passi (~60 s)","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=elephant+walks+hamstring+mobility+drill","come":"Piegati in avanti e appoggia le mani a terra (o sulle tibie,\no su un rialzo se non arrivi). Piega leggermente entrambe le ginocchia.\n**Tenendo le mani ferme**, distendi completamente una gamba mentre l'altra si\npiega di più. Alterna in modo fluido, come una camminata sul posto.","attenzione":"Non cercare di tenere entrambe le gambe tese: il senso è\nproprio l'alternanza. Se senti tirare dietro al ginocchio in modo acuto,\nriduci l'ampiezza — è il nervo, non il muscolo.","sfruttare":"Spingi il tallone della gamba tesa verso il\npavimento e tieni il bacino alto. Allunga gli hamstring **in movimento**,\nche è più efficace dello stretching statico a freddo appena sveglio.","progredire":"Quando le mani arrivano a terra comode, avvicina i piedi\nalle mani.","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:single-leg-rdl":{"nome":"Single leg RDL","figura":"single-leg-rdl.svg","quanto":"45 s per lato","recupero":"nessuno","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=single+leg+rdl+bodyweight+tutorial+hip+hinge","come":"In piedi su una gamba sola. **Schiena dritta**, manda il\nbacino indietro e inclina il busto in avanti mentre la gamba libera sale tesa\ndietro di te, in linea con il corpo. Scendi finché controlli il movimento,\npoi risali stringendo forte il gluteo della gamba a terra.","attenzione":"La schiena deve restare **neutra**: se si arrotonda per\nscendere più in basso, fermati prima. È l'unico esercizio della mattina che\npuò caricarti la lombare, quindi meglio poco e pulito. Se perdi l'equilibrio,\nsfiora il muro o la sedia con una mano: non è barare.","sfruttare":"Il movimento è **una cerniera all'anca**, non\nun piegamento della schiena: il sedere va indietro, non il busto giù. È il\ngesto che protegge la tua zona lombare per tutta la vita, e attiva i glutei\nche otto ore di sedia spengono.","progredire":"Quando 45 s per lato sono stabili senza appoggi, rallenta\na 4 secondi in discesa. Poi tieni uno zaino leggero contro il petto.","serie":1,"secondi":45,"per_lato":true,"recupero_s":0},"M:affondo-con-rotazione":{"nome":"Affondo con rotazione","figura":"affondo-con-rotazione.svg","quanto":"4 per lato","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=worlds+greatest+stretch+tutorial","come":"Dalla posizione di plank, porta il piede destro fuori,\naccanto alla mano destra, in affondo profondo. Appoggia entrambe le mani a\nterra, poi solleva la destra ruotando il petto verso l'alto e seguila con lo\nsguardo. Torna giù e cambia lato.","attenzione":"La gamba dietro deve restare tesa con il ginocchio\nsollevato, altrimenti il flessore dell'anca — quello accorciato da otto ore di\nsedia — non viene allungato.","sfruttare":"In apertura spingi attivamente il bacino verso\nil pavimento. Apre anche, torace e spalle tutto in una volta: se ne devi\nsaltare uno, non sia questo.","progredire":"Fermati 3 secondi nella rotazione, poi passa a 5 per lato.","serie":1,"secondi":0,"per_lato":true,"recupero_s":0},"M:dead-hang":{"nome":"Dead hang","figura":"dead-hang.svg","quanto":"2 × 30 s","recupero":"15 s tra le due","attrezzi":"sbarra","video":"https://www.youtube.com/results?search_query=dead+hang+tutorial+beginner","mattino":"La sera il dead hang è **attivo** (spalle\ningaggiate) ed è un test. Al mattino è **passivo**: afferra la sbarra e\nlasciati appendere completamente, rilassando piedi, gambe e bacino, e respira\ncon la pancia. Lascia lavorare la gravità.","attenzione":"Scendi controllato, non lasciarti cadere. Se la presa cede\nprima del tempo, va benissimo: a inizio percorso è normale.","sfruttare":"Dopo otto ore di sedia e una notte a letto, la\ncolonna si decomprime. È anche volume gratuito verso il tuo obiettivo n°2:\ntre mattine a settimana valgono più di quanto sembri.","come":"Appeso alla sbarra, presa alla larghezza delle spalle, pollici\nattorno. Braccia tese, spalle **attive**: non lasciarti crollare passivamente\ndentro le spalle. Corpo fermo.","progredire":"Nel riscaldamento resta a 30 s. Il tempo massimo si allena\nin B1.","vedi":"","da_sigla":"R5","serie":2,"secondi":30,"per_lato":false,"recupero_s":15},"M:trazione-scapolare":{"nome":"Trazione scapolare","figura":"trazione-scapolare.svg","quanto":"8 ripetizioni lente","recupero":"nessuno","attrezzi":"sbarra","video":"https://www.youtube.com/results?search_query=scapular+pull+ups+tutorial+first+pull+up","mattino":"Nessuna ricerca del massimo: 8 ripetizioni lente\ne controllate, 2 secondi di tenuta in basso, per svegliare le scapole. Il\nlavoro di forza vero è in sessione B.","attenzione":"I gomiti restano **tesi**. Se si piegano stai tentando una\ntrazione, che al mattino non ci va.","come":"Appeso a braccia tese. Senza piegare i gomiti, **abbassa le\nspalle** allontanandole dalle orecchie: il corpo sale di 3-5 cm. Tieni un\nsecondo in alto, poi torna giù controllato.","sfruttare":"È il pezzo mancante di chi non riesce a fare\ntrazioni: prima di tirare con le braccia devi saper **attivare le scapole**.\nNella tua situazione — zero trazioni — è l'esercizio che sblocca la prima.","progredire":"8 × 2 sedute → aggiungi 2 s di tenuta in alto, poi passa\na farle su un braccio alla volta.","vedi":"","da_sigla":"B2","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:squat-to-stand":{"nome":"Squat to stand","figura":"squat-to-stand.svg","quanto":"8 ripetizioni","recupero":"nessuno","attrezzi":"nessuno","video":"https://www.youtube.com/results?search_query=squat+to+stand+mobility+drill","mattino":"Niente, stessa esecuzione del riscaldamento\nserale. Appena sveglio scendi con più calma: le anche sono più rigide.","come":"In piedi, piegati e afferra le punte dei piedi. Da lì scendi in\naccosciata profonda tenendo le mani sui piedi e il petto alto. Poi alza il\nbacino distendendo le gambe, senza lasciare i piedi. Ripeti.","attenzione":"Se non arrivi ai piedi a gambe tese, piega le ginocchia\nquanto serve: l'obiettivo non è toccare i piedi, è passare tra le due posizioni.","sfruttare":"Nella fase bassa spingi i gomiti contro\nl'interno delle ginocchia per aprire le anche. Prepara anche, caviglie e\nischiocrurali in un colpo solo.","progredire":"Da 8 a 10 quando la fase bassa è comoda.","vedi":"","da_sigla":"R3","serie":1,"secondi":0,"per_lato":false,"recupero_s":0},"M:stretch-dei-flessori-dellanca":{"nome":"Stretch dei flessori dell'anca","figura":"stretch-flessori-anca.svg","quanto":"45 s per lato","recupero":"nessuno","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=kneeling+hip+flexor+stretch+posterior+pelvic+tilt","mattino":"Nulla nell'esecuzione, ma qui è un pezzo\ncentrale e non uno scarico: sei appena stato otto ore sdraiato e stai per\nstarne altre otto seduto. **Retroversione del bacino prima**, spinta in avanti\ndopo — mai il contrario.","come":"In affondo con il ginocchio dietro a terra. Porta il **bacino\nsotto** (retroversione) e contrai il gluteo della gamba dietro, poi spingi\navanti di pochi centimetri.","attenzione":"Se inarchi la schiena per andare più avanti, l'allungamento\nsparisce e la lombare si carica. Bacino sotto **prima**, avanzamento dopo.","sfruttare":"Il gluteo contratto è ciò che rende efficace\nquesto stretch. Sono i muscoli più accorciati da chi sta seduto tutto il\ngiorno, e tirano direttamente sulla tua zona lombare.","vedi":"","da_sigla":"S2","serie":1,"secondi":45,"per_lato":true,"recupero_s":0},"M:posizione-del-bambino":{"nome":"Posizione del bambino","figura":"posizione-bambino.svg","quanto":"60 s","recupero":"fine della routine","attrezzi":"tappetino","video":"https://www.youtube.com/results?search_query=childs+pose+balasana+tutorial","mattino":"Nulla. Chiude M3 riportando la respirazione\ntranquilla prima di iniziare la giornata.","come":"In ginocchio, ginocchia larghe e alluci che si toccano.\nSiediti sui talloni e allunga le braccia in avanti, fronte a terra.","attenzione":"Se le ginocchia danno fastidio, metti un cuscino sotto i\nglutei.","sfruttare":"Respira dentro la schiena: senti la zona\nlombare che si apre a o /* ------------------------------------------------------------------ base */

const $ = s => document.querySelector(s);
const SCH = $("#schermo"), FONDO = $("#fondo");
const VELOCE = new URLSearchParams(location.search).has("veloce") ? 10 : 1;
const vibra = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// markdown minimo: grassetto, corsivo, elenchi. Il resto dei .md non arriva qui.
const testo = t => esc(t || "")
  .replace(/\*\*(.+?)\*\*/gs, "<b>$1</b>")
  .replace(/\*(.+?)\*/gs, "<i>$1</i>")
  .replace(/\n(?=\s*(?:\d+\.|[-·]))/g, "<br>")
  .replace(/\n\n+/g, "<p>")
  .replace(/\n/g, " ");

const mmss = s => {
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const oggi = () => new Date().toISOString().slice(0, 10);
const ggmm = d => d.slice(8, 10) + "/" + d.slice(5, 7);

const leggi = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const salvaIn = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const storico = () => leggi("sedute", []);

/* Gli esercizi chiave: campo di fine seduta -> esercizi che lo allenano.
   Trazioni e plank frontale non stanno in nessuna seduta (§6 del PIANO): restano
   voci della tabella dei test, si compilano a mano. */
const CHIAVE = [
  { id: "dead_hang_s", eti: "Dead hang (s)", log: "dead hang", u: " s", k: ["comune:R5", "M:dead-hang"] },
  { id: "negativa_s", eti: "Negativa, s di discesa", log: "negativa", u: " s", k: ["B:B3"] },
  { id: "piegamenti", eti: "Piegamenti (ripetizioni)", log: "piegamenti", u: "", k: ["A:A4"] },

];

const PARAGRAFI = [["come", "Come si fa"], ["attenzione", "Attenzione a"],
                   ["sfruttare", "Per sfruttarlo al meglio"], ["progredire", "Come progredire"],
                   ["mattino", "Cosa cambia al mattino"]];

/* ------------------------------------------------------------- rotazione */

function prossime(st) {
  const ultima = t => [...st].reverse().find(s => s.tipo === t);
  const m = ultima("mattutina"), f = ultima("forza");
  const ciclo = ["M1", "M2", "M3"];
  return {
    m: m ? ciclo[(ciclo.indexOf(m.sessione) + 1) % 3] : "M1",
    f: f ? (f.sessione === "A" ? "B" : "A") : "A",
  };
}

/* Le sedute salvate citano le sigle di quando sono state fatte: se la scheda
   non c'e' piu' si dice, non si rompe (§9 del PIANO). */
function nomeDi(nomeSeduta, sigla) {
  const sed = DATI.sedute[nomeSeduta];
  const v = sed && sed.esercizi.find(e => (e.sigla || e.chiave) === sigla);
  return v ? DATI.esercizi[v.chiave].nome : sigla + " (non più in programma)";
}

/* ------------------------------------------------------------- i passi */

/* Un passo = una serie (e un lato) di un esercizio. La seduta e' la lista
   piatta dei passi: un indice solo, niente stati annidati. */
function costruisciPassi(nome) {
  const sed = DATI.sedute[nome], passi = [];
  let ei = 0;

  const aggiungi = (voce, n, giro, nGiri) => {
    const e = DATI.esercizi[voce.chiave];
    // la mattutina prescrive nella tabella della routine, la forza nella scheda
    const q = voce.secondi === undefined ? e : voce;
    const nLati = q.per_lato && q.secondi ? 2 : 1;   // 45 s per lato = due countdown
    ei++;
    for (let s = 1; s <= q.serie; s++)
      for (let l = 1; l <= nLati; l++)
        passi.push({
          ei, n, k: voce.chiave, sigla: voce.sigla || voce.chiave,
          nome: e.nome, blocco: voce.blocco,
          quanto: voce.quanto || e.quanto, cue: voce.cue || "",
          serie: s, nSerie: q.serie, lato: l, nLati, giro, nGiri,
          secondi: q.secondi,
          // il recupero e' dopo l'ultimo lato della serie, mai tra i due lati
          recupero: l === nLati ? q.recupero_s : 0,
        });
  };

  if (sed.tipo === "mattutina") {
    sed.esercizi.forEach((v, i) => aggiungi(v, i + 1, 1, 1));
  } else {
    const blocchi = [];
    sed.esercizi.forEach((v, i) => {
      const b = blocchi[blocchi.length - 1];
      if (b && b.n === v.blocco) b.voci.push({ v, i }); else blocchi.push({ n: v.blocco, voci: [{ v, i }] });
    });
    for (const b of blocchi) {
      const info = sed.blocchi[b.n] || { giri: 1, recupero_giro_s: 0 };
      for (let g = 1; g <= info.giri; g++) {
        const da = passi.length;
        b.voci.forEach(x => aggiungi(x.v, x.i + 1, g, info.giri));
        if (info.giri > 1)      // il recupero di fine giro batte quello dell'esercizio
          passi[passi.length - 1].recupero = g < info.giri ? info.recupero_giro_s : 0;
        void da;
      }
    }
  }
  if (passi.length) passi[passi.length - 1].recupero = 0;   // finita, non si riposa
  return passi;
}

/* --------------------------------------------------------------- schermi */

let tutte = false;   // lo storico in home: solo le ultime 6 o tutto

function vaiHome() {
  fermaTimer();
  S = null;
  const st = storico(), p = prossime(st), corso = leggi("corso", null);
  const data = new Date().toLocaleDateString("it-IT",
    { weekday: "long", day: "numeric", month: "long" });
  const bottone = (n, eti) => `<button class="grande primario" data-a="apri" data-v="${n}">${eti}</button>`;

  let h = `<h1>Allenamento</h1><p class="spento">${data[0].toUpperCase() + data.slice(1)}</p>`;

  if (corso)
    h += `<div class="card"><b>Seduta ${corso.nome} lasciata a metà</b>
      <p class="spento">esercizio ${corso.passi_n || "?"} · ${mmss(corso.tot)} di lavoro</p>
      <div class="riga"><button data-a="riprendi">Riprendi</button>
      <button data-a="butta">Butta via</button></div></div>`;

  h += bottone(p.m, `Mattutina (${p.m})`) + bottone(p.f, `Forza (${p.f})`);
  h += `<p><button class="piccolo" data-a="altre">scegli un'altra</button></p>
        <div id="altre" hidden class="riga">` +
    Object.keys(DATI.sedute).map(n =>
      `<button class="piccolo" data-a="apri" data-v="${n}">${n}</button>`).join("") + `</div>`;

  const nuove = st.filter(s => !s.esportata).length;
  h += `<p class="riga"><button class="piccolo" data-a="esporta">Esporta${nuove ? " (" + nuove + ")" : ""}</button>
        <button class="piccolo" data-a="esportatutto">Esporta tutto</button></p>`;

  if (st.length) {
    // ogni riga porta il suo indice: la lista e' rovesciata, l'indice no
    const righe = st.map((s, i) => ({ s, i }));
    h += `<h2>Ultime sedute</h2>` +
      (tutte ? righe : righe.slice(-6)).reverse().map(({ s, i }) =>
        `<div class="voce"><span>${ggmm(s.data)} · ${s.tipo === "forza" ? "Forza " : ""}${s.sessione} · ${Math.round(s.durata_s / 60)} min ${s.sensazione || ""}` +
        (s.saltati.length ? ` · saltati: ${s.saltati.map(g => esc(nomeDi(s.sessione, g))).join(", ")}` : "") +
        (s.esportata ? "" : " · <b>da esportare</b>") +
        `</span><button class="piccolo" data-a="copiauna" data-v="${i}">copia</button>` +
        `<button class="piccolo" data-a="elimina" data-v="${i}">elimina</button></div>`).join("");
    if (st.length > 6)
      h += `<p><button class="piccolo" data-a="tutte">${tutte ? "mostra solo le ultime" : `mostra tutte (${st.length})`}</button></p>`;
  }

  h += `<hr><p class="spento"><small>build ${DATI.build}` +
       (VELOCE > 1 ? " · <b>modalità veloce 10×</b>" : "") + `</small></p>`;
  SCH.innerHTML = h;
  FONDO.innerHTML = "";
}

/* ----------------------------------------------------------- la seduta */

let S = null, batti = null, ultimo = 0, wake = null;

function apri(nome, ripresa) {
  // una seduta ripresa riparte dall'esercizio dov'era, ferma, con il suo
  // cronometro: il tap su Inizia e' lo stesso di sempre
  S = Object.assign({ nome, i: 0, tot: 0, saltati: [] }, ripresa,
                    { fase: "lavoro", resto: 0, conto: false, pausa: false, avviata: false });
  S.passi = costruisciPassi(S.nome);
  if (S.i >= S.passi.length) S.i = 0;    // le schede sono cambiate sotto i piedi
  entra(S.i);
  avviaTimer();
}

function entra(i) {
  S.i = i;
  const p = S.passi[i];
  S.fase = "lavoro";
  S.resto = p.secondi;
  S.conto = S.avviata && p.secondi > 0;
  salvaCorso();
  disegnaPasso();
}

function salvaCorso() {
  if (!S) return;
  salvaIn("corso", { nome: S.nome, i: S.i, tot: S.tot, saltati: S.saltati,
                     passi_n: S.passi[S.i] ? S.passi[S.i].n : 1 });
}

function disegnaPasso() {
  const p = S.passi[S.i], e = DATI.esercizi[p.k];
  const sed = DATI.sedute[S.nome];
  const tot = sed.esercizi.length;
  const blocco = sed.blocchi && sed.blocchi[p.blocco] ? sed.blocchi[p.blocco].nome : "";

  const tag = [];
  if (p.nSerie > 1) tag.push(`serie ${p.serie}/${p.nSerie}`);
  if (p.nLati > 1) tag.push(`lato ${p.lato}/${p.nLati}`);
  if (p.nGiri > 1) tag.push(`giro ${p.giro}/${p.nGiri}`);

  SCH.innerHTML = `
  <div class="barra">
    <button class="cron${S.pausa ? " pausa" : ""}" data-a="pausa" id="cron">${mmss(S.tot)}</button>
    <span class="dove">${blocco ? esc(blocco) + " · " : ""}${p.n} / ${tot}</span>
    <button class="piccolo" data-a="esci">Esci</button>
  </div>
  <div class="card">
    <h2>${p.sigla !== p.k ? esc(p.sigla) + " · " : ""}${esc(p.nome)}</h2>
    <p>${esc(p.quanto)}${e.recupero && e.recupero !== "nessuno" ? ` <span class="spento">· recupero ${esc(e.recupero)}</span>` : ""}
       ${tag.map(t => `<span class="tag">${t}</span>`).join(" ")}</p>
    ${p.cue ? `<p class="cue">» ${esc(p.cue)}</p>` : ""}
    ${DATI.figure[e.figura] || ""}
    <div class="conto" id="conto"></div>
    ${e.attrezzi && e.attrezzi !== "nessuno" ? `<p class="spento"><small>attrezzi: ${esc(e.attrezzi)}</small></p>` : ""}
  </div>
  ${PARAGRAFI.filter(([k]) => e[k]).map(([k, eti]) =>
    `<details><summary>${eti}</summary><div>${testo(e[k])}</div></details>`).join("")}
  ${e.video ? `<p><a href="${esc(e.video)}" target="_blank" rel="noopener">🎥 Cerca il video</a></p>` : ""}`;

  FONDO.innerHTML = `
    <button data-a="indietro">Indietro</button>
    <button data-a="salta">Salta</button>
    <button class="primario" data-a="avanti" id="avanti"></button>`;
  disegnaTempi();
}

function disegnaTempi() {
  const c = $("#cron"); if (!c || !S) return;
  c.textContent = (S.pausa ? "▶ " : "") + mmss(S.tot);   // in pausa: tocca per ripartire
  c.classList.toggle("pausa", S.pausa);
  const p = S.passi[S.i], box = $("#conto"), bot = $("#avanti");
  const riposo = S.fase === "recupero";
  const finito = S.resto <= 0;
  if (riposo || p.secondi) {
    box.textContent = (riposo ? "riposo " : "") + mmss(S.resto);
    box.className = "conto" + (riposo ? " riposo" : "") + (finito && S.avviata ? " finito" : "");
  } else {
    box.textContent = "";
    box.className = "conto";
  }
  bot.textContent = !S.avviata ? "Inizia" : riposo ? (finito ? "Avanti" : "Salta il riposo") : "Fatto";
}

function avviaTimer() {
  fermaTimer();
  ultimo = performance.now();
  batti = setInterval(() => {
    const ora = performance.now(), dt = (ora - ultimo) / 1000 * VELOCE;
    ultimo = ora;
    if (!S || S.pausa || !S.avviata) return;
    S.tot += dt;
    if (S.conto) {
      S.resto -= dt;
      if (S.resto <= 0) { S.resto = 0; S.conto = false; vibra([250, 100, 250]); }
    }
    disegnaTempi();
  }, 200);
}
const fermaTimer = () => { clearInterval(batti); batti = null; };

async function tieniAcceso(on) {
  try {
    if (on) { wake = await navigator.wakeLock.request("screen"); }
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S && S.avviata) tieniAcceso(true);
});

/* --- comandi della seduta --- */

function avanti() {
  const p = S.passi[S.i];
  if (!S.avviata) {                       // primo tap: parte il cronometro
    S.avviata = true;
    S.conto = p.secondi > 0;
    tieniAcceso(true);
    disegnaTempi();
    return;
  }
  if (S.fase === "lavoro" && p.recupero > 0) {
    S.fase = "recupero"; S.resto = p.recupero; S.conto = true;
    salvaCorso(); disegnaTempi(); return;
  }
  passaAl(S.i + 1);
}

function passaAl(i) {
  if (i >= S.passi.length) return fine();
  entra(i);
}

function salta() {
  const p = S.passi[S.i];
  if (!S.saltati.includes(p.sigla)) S.saltati.push(p.sigla);
  let i = S.i;
  while (i < S.passi.length && S.passi[i].ei === p.ei) i++;
  passaAl(i);
}

function indietro() {
  const ei = S.passi[S.i].ei;
  let j = S.i;
  while (j > 0 && S.passi[j - 1].ei === ei) j--;      // inizio dell'esercizio corrente
  if (j === S.i && j > 0) {                            // gia' all'inizio: quello prima
    const pr = S.passi[j - 1].ei;
    while (j > 0 && S.passi[j - 1].ei === pr) j--;
  }
  entra(j);
}

/* ---------------------------------------------------------- fine seduta */

function fine() {
  fermaTimer(); tieniAcceso(false);
  const sed = DATI.sedute[S.nome];
  const chiavi = new Set(sed.esercizi.map(e => e.chiave));
  const campi = CHIAVE.filter(c => c.k.some(k => chiavi.has(k)));
  const fatti = sed.esercizi.length - S.saltati.length;

  SCH.innerHTML = `<h1>Fatta.</h1>
  <p><b>${mmss(S.tot)}</b> · ${fatti} esercizi su ${sed.esercizi.length}
     ${S.saltati.length ? `<br><span class="spento">saltati: ${S.saltati.map(g => esc(nomeDi(S.nome, g))).join(", ")}</span>` : ""}</p>

  ${campi.length ? `<h2>Numeri chiave</h2>
    <p class="spento"><small>Solo quelli che vuoi. Vuoto = non misurato.</small></p>
    ${campi.map(c => `<label for="c_${c.id}">${c.eti}</label>
      <input id="c_${c.id}" type="number" inputmode="numeric" step="any" min="0">`).join("")}` : ""}

  <h2>Come è andata</h2>
  <div class="riga">${["🟢", "🟡", "🔴"].map(s =>
    `<button class="grande" data-a="senso" data-v="${s}" id="s_${s}">${s}</button>`).join("")}</div>

  <label for="note">Feedback libero</label>
  <textarea id="note" rows="3" placeholder="Solo se c'è qualcosa da dire."></textarea>

  <label><input type="checkbox" id="hafastidio" data-a="fastidio" style="width:auto"> Ho sentito un fastidio</label>
  <div id="boxfastidio" hidden>
    <label for="f_dove">Dove esattamente</label><input id="f_dove">
    <label for="f_es">Con quale esercizio</label>
    <select id="f_es"><option value=""></option>${sed.esercizi.map(v =>
      `<option>${esc(DATI.esercizi[v.chiave].nome)}</option>`).join("")}</select>
    <label for="f_punto">In che punto del movimento</label><input id="f_punto">
    <label for="f_quando">Durante o il giorno dopo</label>
    <select id="f_quando"><option>durante</option><option>il giorno dopo</option></select>
    <label for="f_durata">Passato subito o rimasto</label>
    <select id="f_durata"><option>passato subito</option><option>rimasto</option></select>
    <label for="f_tipo">Muscolare o articolare</label>
    <select id="f_tipo"><option>muscolare (diffuso)</option><option>articolare (puntuale)</option></select>
  </div>
  <p class="spento"><small>Dolore articolare = si scende di progressione lo stesso giorno.</small></p>`;

  FONDO.innerHTML = `<button data-a="riprendifine">Riprendi la seduta</button>
    <button class="primario" data-a="salvafine">Salva</button>`;
}

function salvaFine() {
  const v = id => { const n = $("#" + id); return n ? n.value.trim() : ""; };
  const chiave = {};
  for (const c of CHIAVE) {
    const n = $("#c_" + c.id);
    if (n && n.value !== "") chiave[c.id] = Number(n.value);
  }
  const rec = {
    data: oggi(),
    tipo: DATI.sedute[S.nome].tipo,
    sessione: S.nome,
    durata_s: Math.round(S.tot / VELOCE),
    saltati: S.saltati,
    chiave,
    sensazione: S.sensazione || "",
    note: v("note"),
  };
  if ($("#hafastidio").checked)
    rec.fastidio = {
      dove: v("f_dove"), esercizio: v("f_es"), punto: v("f_punto"),
      quando: v("f_quando"), durata: v("f_durata"), tipo: v("f_tipo"),
    };
  const st = storico();
  st.push(rec);
  salvaIn("sedute", st);
  localStorage.removeItem("corso");
  S = null;
  vaiHome();
  SCH.insertAdjacentHTML("afterbegin",
    `<p class="card"><b>Salvata.</b> Quando puoi, premi <i>Esporta</i> e incolla il testo in chat.</p>`);
}

/* --------------------------------------------------------------- export */

/* Una riga per giorno: la tabella del diario ha sia Sessione sia Mattutina. */
function rigaLog(recs) {
  const forza = recs.filter(r => r.tipo === "forza").pop();
  const matt = recs.filter(r => r.tipo === "mattutina").pop();
  const numeri = [];
  for (const c of CHIAVE)
    for (const r of recs)
      if (r.chiave && r.chiave[c.id] !== undefined) {
        const e = c.k.map(k => DATI.esercizi[k]).find(Boolean);
        const serie = e && e.serie > 1 ? " × " + e.serie : "";
        numeri.push(`${c.log} ${r.chiave[c.id]}${c.u}${serie}`);
      }
  const senso = (forza && forza.sensazione) || (matt && matt.sensazione) || "";
  return `| ${ggmm(recs[0].data)} | ${forza ? forza.sessione : ""} | ${matt ? matt.sessione : ""} | ${numeri.join(", ")} | ${senso} |`;
}

function nota(recs) {
  const con = recs.filter(r => r.note || r.fastidio);
  if (!con.length) return "";
  const f = con.map(r => r.fastidio).find(Boolean);
  const d = recs[0].data;
  let t = `# Nota del ${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}\n\n`;
  t += `**Tipo:** ${f ? "dolore" : "nota libera"}\n\n---\n\n## Cosa è successo\n\n`;
  t += (con.map(r => r.note).filter(Boolean).join("\n\n") || "(vedi sotto)") + "\n";
  if (f) t += `\n## Se è un dolore o un fastidio\n\n` +
    `- **Dove esattamente:** ${f.dove}\n- **Con quale esercizio:** ${f.esercizio}\n` +
    `- **In che punto del movimento:** ${f.punto}\n- **Durante o il giorno dopo:** ${f.quando}\n` +
    `- **Passato subito o rimasto:** ${f.durata}\n- **Muscolare (diffuso) o articolare (puntuale):** ${f.tipo}\n`;
  return t;
}

const rigaJson = r => JSON.stringify({
  data: r.data, tipo: r.tipo, sessione: r.sessione, durata_s: r.durata_s,
  saltati: r.saltati, chiave: r.chiave, sensazione: r.sensazione,
  note: r.note, ...(r.fastidio ? { fastidio: r.fastidio } : {}),
});

/* solo = indice di una seduta sola ("copia" dalla home); altrimenti tutte le
   nuove, o tutto lo storico con ?tutto. */
function testoExport(tutto, solo) {
  const st = storico();
  const scelte = solo != null ? [st[solo]] : st.filter(r => tutto || !r.esportata);
  const date = [...new Set(scelte.map(r => r.data))].sort();
  if (!date.length) return "Niente da esportare: tutte le sedute sono già state incollate.";
  // La riga e' per giorno e l'export dice "sostituiscila": va ricomposta da
  // tutte le sedute di quel giorno, anche gia' esportate, o ne perdi una meta'.
  const delGiorno = d => (solo != null ? scelte : st).filter(r => r.data === d);

  let t = `Sedute da registrare nel diario (${date.length} ${date.length === 1 ? "giorno" : "giorni"}).\n` +
    `Se una riga con la stessa data esiste già nel diario, sostituiscila.\n\n` +
    `--- diario/diario.md · tabella "Log delle sedute" ---\n\n`;
  for (const d of date) t += rigaLog(delGiorno(d)) + "\n";

  for (const d of date) {
    const n = nota(delGiorno(d));
    if (n) t += `\n--- diario/${d}.md ---\n\n${n}`;
  }
  if (tutto)
    t += `\n--- diario/sedute.jsonl · storico completo, ${st.length} sedute ---\n\n` +
      st.map(rigaJson).join("\n") + "\n";
  return t;
}

function esporta(tutto, solo) {
  const t = testoExport(tutto, solo);
  SCH.innerHTML = `<h1>Export</h1>
    <p class="spento">Incollalo in chat: i file del diario li scrivo io da qui.</p>
    <pre id="ex">${esc(t)}</pre>`;
  FONDO.innerHTML = `<button data-a="home">Chiudi</button>
    ${navigator.share ? `<button data-a="condividi">Condividi</button>` : ""}
    <button class="primario" data-a="copia">Copia</button>`;
  try { navigator.clipboard.writeText(t); } catch (e) {}
  const st = storico();
  st.forEach((r, i) => { if (solo == null || i === Number(solo)) r.esportata = true; });
  salvaIn("sedute", st);
}

function elimina(i) {
  const st = storico(), r = st[Number(i)];
  if (!r) return;
  if (!confirm(`Elimino la seduta del ${ggmm(r.data)} (${r.sessione})?\nNon si torna indietro.`)) return;
  st.splice(Number(i), 1);
  salvaIn("sedute", st);
  vaiHome();
}

/* ---------------------------------------------------------------- click */

const AZIONI = {
  apri: n => apri(n),
  altre: () => { const d = $("#altre"); d.hidden = !d.hidden; },
  riprendi: () => { const c = leggi("corso", null); if (c) apri(c.nome, c); },
  butta: () => { localStorage.removeItem("corso"); vaiHome(); },
  esci: () => { salvaCorso(); tieniAcceso(false); vaiHome(); },
  pausa: () => { S.pausa = !S.pausa; salvaCorso(); disegnaTempi(); },
  avanti, salta, indietro,
  senso: (s, b) => {
    S.sensazione = s;
    document.querySelectorAll("[data-a=senso]").forEach(x => x.classList.remove("scelto"));
    b.classList.add("scelto");
  },
  fastidio: () => { $("#boxfastidio").hidden = !$("#hafastidio").checked; },
  riprendifine: () => { avviaTimer(); entra(S.i); },
  salvafine: salvaFine,
  esporta: () => esporta(false),
  esportatutto: () => esporta(true),
  copiauna: i => esporta(false, Number(i)),
  elimina,
  tutte: () => { tutte = !tutte; vaiHome(); },
  copia: () => {
    const t = $("#ex").textContent;
    const ok = () => alert("Copiato.");
    try { navigator.clipboard.writeText(t).then(ok, () => selezionaTutto()); }
    catch (e) { selezionaTutto(); }
  },
  condividi: () => navigator.share({ text: $("#ex").textContent }).catch(() => {}),
  home: vaiHome,
};

function selezionaTutto() {
  const r = document.createRange();
  r.selectNodeContents($("#ex"));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  alert("Copia a mano: il testo è già selezionato.");
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (b && AZIONI[b.dataset.a]) AZIONI[b.dataset.a](b.dataset.v, b);
});
addEventListener("pagehide", salvaCorso);

/* -------------------------------------------------------------- autotest
   ?test=1 — la logica che si puo' rompere in silenzio: passi, rotazione,
   riga di log. Il resto si vede a occhio aprendo l'app. */
function autotest() {
  const ok = (c, m) => { if (!c) throw new Error(m); };
  const sigle = n => costruisciPassi(n).map(p => p.sigla);

  const a = costruisciPassi("A");
  ok(a[0].sigla === "R1", "A parte dal riscaldamento");
  ok(sigle("A").filter(s => s === "A1").length === 3, "L-sit: 3 serie");
  ok(sigle("A").filter(s => s === "F1").length === 2, "finisher: 2 giri");
  ok(sigle("B").filter(s => s === "B6").length === 6, "plank laterale: 3 serie × 2 lati");
  ok(a[a.length - 1].recupero === 0, "l'ultimo passo non ha recupero");
  const f1 = a.filter(p => p.sigla === "F2");
  ok(f1[0].recupero === 45 && f1[1].recupero === 0, "45 s solo tra un giro e l'altro");
  const a1 = a.filter(p => p.sigla === "A1");
  ok(a1[0].recupero === 60 && a1[0].secondi === 20, "L-sit 20 s / recupero 60 s");
  ok(sigle("M1").length === 8, "M1: 8 passi, nessuna serie multipla");

  ok(prossime([]).m === "M1" && prossime([]).f === "A", "storico vuoto: M1 e A");
  ok(prossime([{ tipo: "mattutina", sessione: "M3" }]).m === "M1", "M3 -> M1");
  ok(prossime([{ tipo: "forza", sessione: "A" }]).f === "B", "A -> B");

  const riga = rigaLog([
    { data: "2026-08-18", tipo: "forza", sessione: "B", chiave: { negativa_s: 6, dead_hang_s: 34 }, sensazione: "🟡", saltati: [] },
    { data: "2026-08-18", tipo: "mattutina", sessione: "M2", chiave: {}, sensazione: "🟢", saltati: [] },
  ]);
  ok(riga === "| 18/08 | B | M2 | dead hang 34 s, negativa 6 s × 3 | 🟡 |", riga);

  // "copia" su una seduta sola: la riga esce con l'altra colonna vuota
  const sola = rigaLog([{ data: "2026-08-18", tipo: "mattutina", sessione: "M2", chiave: {}, sensazione: "🟢", saltati: [] }]);
  ok(sola === "| 18/08 |  | M2 |  | 🟢 |", sola);

  ok(nomeDi("A", "A1") === "L-sit" && nomeDi("A", "Z9").includes("non più"), "sigle sparite");
  return "test ok";
}

vaiHome();

// da file:// non c'e' service worker: la verifica in locale non deve rompersi
navigator.serviceWorker?.register("sw.js").catch(() => {});

if (new URLSearchParams(location.search).has("test")) {
  let esito;
  try { esito = autotest(); } catch (e) { esito = "TEST ROTTO: " + e.message; }
  document.title = esito;
  SCH.insertAdjacentHTML("afterbegin", `<p class="card"><b>${esc(esito)}</b></p>`);
}
</script>
